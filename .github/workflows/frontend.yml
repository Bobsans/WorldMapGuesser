name: Application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: go test -tags dev -race ./...
        working-directory: server
      - run: go vet -tags dev ./...
        working-directory: server
      - run: test -z "$(gofmt -l .)"
        working-directory: server
      - run: go run ./cmd/build -target linux/amd64
        working-directory: server
      - run: go test ./...
        working-directory: server
      - run: file bin/world-map-guesser | grep 'statically linked'
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: bash server/test-package.sh bin/world-map-guesser
        working-directory: .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: frontend-test-report
          path: |
            web/playwright-report/
            web/test-results/
            ${{ runner.temp }}/world-map-guesser.log
          if-no-files-found: ignore
